name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y gettext ripgrep
      - name: Verify
        run: ./scripts/verify.sh
